name: build-and-test

# 每次 push 或發 Pull Request 時,自動在雲端電腦上編譯所有範例並跑單元測試。
# 這樣只要有人把範例改壞了,GitHub 上就會立刻顯示紅色叉叉提醒。
on:
  push:
  pull_request:
  workflow_dispatch:   # 也允許在 GitHub 網頁上手動觸發

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: 取得原始碼
        uses: actions/checkout@v4

      - name: 安裝 SDCC 與編譯工具
        run: |
          sudo apt-get update
          sudo apt-get install -y sdcc make build-essential
          echo "---- 版本資訊 ----"
          sdcc --version | head -1
          which sdas8051 sdld packihx gcc

      - name: 回歸測試(編譯所有範例 + 主機端單元測試)
        run: make test
